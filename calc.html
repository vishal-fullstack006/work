<!DOCTYPE html>
<html>
<head>
<title>Calculater</title>
<body>
    <style>


        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #111827;
    font-family: Arial, sans-serif;
}
h1 {
    color: white;
    margin-bottom: 20px;
    font-size: 35px;
}
.card {
    width: 350px;
    padding: 30px;
    background: #1f2937;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    text-align: center;
}

#n1,
#n2 {
    width: 100%;
    height: 50px;
    margin-bottom: 15px;
    padding: 10px;
    border: 2px solid #374151;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 18px;
    outline: none;
}
#n1:focus,
#n2:focus {
    border-color: #3b82f6;
}

button {
    width: 60px;
    height: 55px;
    margin: 5px;
    border: none;
    border-radius: 12px;
    background: #374151;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}


button:hover {
    background: #2563eb;
    transform: scale(1.05);
}


button:active {
    transform: scale(0.95);
}


#output {
    margin-top: 20px;
    padding: 15px;
    min-height: 50px;
    border-radius: 10px;
    background: #111827;
    color: #22c55e;
    font-size: 22px;
    font-weight: bold;
}
    </style>

<h1>Calculator</h1>
<div class="card">
<input type="number" id="n1"><br><br>
<input type="number" id="n2"><br><br>
<button onclick="calac('+')">+</button>
<button onclick="calac('-')">-</button>
<button onclick="calac('*')">x</button>
<button onclick="calac('/')">/</button>
<p id="output"></p>
</div>



<script>
function calac(clc){
var first = Number(document.getElementById("n1").value);
var second = Number(document.getElementById("n2").value);
var answer;

if(clc == "+"){
answer = first + second;
}
else if(clc == "-"){
answer = first - second;
}
else if(clc == "*"){
answer = first * second;
}
else{
answer = first / second;
}

document.getElementById("output").innerText = "Result: " + answer;
}





</script>

</body>
</html>
