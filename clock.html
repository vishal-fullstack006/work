<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #172554, #020617 70%);
        }

        #clock {
            width: min(450px, 85vw);
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 24px;
            border: 2px solid #164e63;
            border-radius: 18px;
            background: linear-gradient(145deg, #0f172a, #020617);
            color: #67e8f9;
            font-family: "Courier New", monospace;
            font-size: clamp(42px, 10vw, 64px);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #22d3ee, 0 0 28px #0891b2;
            box-shadow: 0 0 25px #0891b244, inset 0 0 24px #0891b222;
        }
    </style>

</head>
<body>
    <div id="clock"></div>
    <script>
function clock(){
    time = new Date();
    h = time.getHours();
    m = time.getMinutes();
    s = time.getSeconds();

    document.getElementById("clock").innerText = h+":"+m+":"+s;
    setTimeout(clock,1000);
}
clock()
    </script>
    
</body>
</html>
